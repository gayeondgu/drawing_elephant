<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<title>코끼리 그리기 – 발산에서 정리까지</title>
<style>
:root{--bg:#fff8ef;--sf:#fffdf9;--tx:#3d3129;--mu:#8c7b6b;--bd:#f5dfc3;--ac:#e8750f;--onac:#fff;--g1:#35c4b0;--g2:#9b7bff;--g3:#ffa24c;--un:#ffc83d;--wd:#ff5fa8;--ok:#2fb66f;--er:#ef5a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b19;--sf:#2a2522;--tx:#f6efe8;--mu:#bba99a;--bd:#473e38;--ac:#ffa94d;--onac:#2b1a08}}
:root[data-theme="dark"]{--bg:#1f1b19;--sf:#2a2522;--tx:#f6efe8;--mu:#bba99a;--bd:#473e38;--ac:#ffa94d;--onac:#2b1a08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--sky1,#fff4d9) 0,var(--sky2,#fbdcae) 100%) fixed;color:var(--tx);font:15px/1.6 "Gowun Dodum","Pretendard","Noto Sans KR",system-ui,sans-serif;padding-bottom:130px}
header{padding:16px 20px 4px;max-width:1160px;margin:auto}h1{font-family:"Jua","Gowun Dodum",system-ui,sans-serif;font-size:27px;margin:0;color:var(--ac)}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
main{max-width:1160px;margin:auto;padding:12px 20px}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:22px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.steps span{font-size:13px;padding:5px 12px;border-radius:99px;border:2px solid var(--bd);color:var(--mu);background:var(--sf)}.steps .on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:16px;padding:9px 13px;outline:none}input:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:7px 16px;box-shadow:0 3px 0 var(--bd);transition:transform .12s}button:hover:not(:disabled){transform:translateY(-2px)}button:active:not(:disabled){transform:translateY(2px);box-shadow:none}button.pri{background:linear-gradient(135deg,#ffb04d,#e8750f);border-color:#cf6208;color:#fff;box-shadow:0 3px 0 #cf6208}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.chip{display:inline-block;font-size:12.5px;padding:3px 11px;border-radius:99px;background:var(--bg);border:2px solid var(--bd);margin:2px 4px 2px 0}
.kc{border-left:5px solid var(--c,var(--ac));cursor:pointer;margin:0;min-height:86px}.kc h4{margin:0 0 4px;font-size:15px}.kc small{color:var(--mu)}.kc.uni{background:color-mix(in srgb,var(--un) 18%,var(--sf));border-color:var(--un)}
.msg{font-size:13px;margin:8px 0;color:var(--mu)}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
svg{width:100%;min-height:580px;height:auto;background:radial-gradient(var(--bd) 1.4px,transparent 1.7px) 0 0/22px 22px,var(--sf);border:2px solid var(--bd);border-radius:22px;touch-action:none}
svg text{fill:var(--tx);font-size:14px;pointer-events:none;font-family:inherit}
.nav{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
#tl{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:2px solid var(--bd);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(232,117,15,.18);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#tl .in{max-width:1160px;margin:auto;display:flex;gap:6px;overflow-x:auto;align-items:center}#tl b{font-size:12px;color:var(--mu);white-space:nowrap}
.tn{white-space:nowrap;font-size:12.5px;padding:5px 12px;border-radius:99px;border:2px solid var(--bd);background:var(--bg);cursor:pointer}.tn.cur{border-color:var(--ac);color:var(--ac)}.tn.empty{opacity:.5}
.q{cursor:pointer}.q.sel{outline:2px solid var(--ac)}.q .t{font-size:11px;color:var(--ac);font-weight:600}
.tline{border-left:3px solid var(--bd);margin-left:6px;padding-left:14px}.tline div{margin:0 0 12px;position:relative}.tline div:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}.tline .gap:before{background:var(--wd)}.tline .gap{color:var(--wd)}
.final{font-size:16px;line-height:1.75;white-space:pre-wrap}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body::before{inset:0;background-image:var(--elepat);background-size:420px 420px;opacity:.6}
body::after{right:14px;bottom:92px;width:210px;height:150px;background:var(--elebig) center/contain no-repeat;opacity:.9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.2}:root:not([data-theme="light"]) body::after{opacity:.5}}
:root[data-theme="dark"] body::before{opacity:.2}:root[data-theme="dark"] body::after{opacity:.5}
@media(max-width:640px){body::after{width:130px;height:93px;bottom:84px}}
:root{--sky1:#fff4d9;--sky2:#fbdcae}
#ele{position:fixed;left:0;bottom:80px;width:104px;height:74px;z-index:3;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#ele.drag{cursor:grabbing}#ele .fl{width:100%;height:100%}
#ele svg{width:100%;height:100%;min-height:0;overflow:visible;display:block;animation:bob .5s ease-in-out infinite alternate;background:none;border:none}
#ele .lg{transform-box:fill-box;transform-origin:50% 0;animation:swing .5s ease-in-out infinite alternate}#ele .lg.b{animation-delay:-.25s}
#ele .ear{transform-box:fill-box;transform-origin:85% 15%;animation:flap 1.1s ease-in-out infinite alternate}
#ele.idle svg,#ele.idle .lg{animation:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes swing{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}@keyframes flap{from{transform:rotate(0)}to{transform:rotate(-12deg)}}
#bub{position:fixed;z-index:4;background:var(--sf);border:2px solid var(--bd);border-radius:14px;padding:4px 10px;font-size:13px;pointer-events:none;white-space:nowrap;display:none}
.ht{position:fixed;z-index:4;pointer-events:none;animation:up 1.2s ease-out forwards;font-size:18px}@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
@media(prefers-reduced-motion:reduce){#ele svg,#ele .lg,#ele .ear{animation:none}}
html::before{content:"";position:fixed;left:0;right:0;bottom:0;height:340px;z-index:-1;pointer-events:none;background-image:var(--safari),linear-gradient(to bottom,transparent calc(100% - 72px),#d8a257 calc(100% - 72px));background-repeat:repeat-x,no-repeat;background-position:left var(--px,0px) bottom 70px,0 0;background-size:auto 260px,100% 100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2a2118;--sky2:#1b1511}:root:not([data-theme="light"])::before{opacity:.35}}
:root[data-theme="dark"]{--sky1:#2a2118;--sky2:#1b1511}:root[data-theme="dark"]::before{opacity:.35}
#tlsm{max-width:1160px;margin:6px auto 0;font-size:12.5px;color:var(--mu);cursor:pointer;max-height:38vh;overflow:auto}#tlsm b{color:var(--tx)}#tlsm .one{display:inline-block;max-width:100%;vertical-align:bottom;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tlsm div div{margin:2px 0}
.topic-card{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border:1.5px solid var(--bd);border-radius:14px;margin:8px 0}
.topic-card .tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);color:var(--ac);white-space:nowrap}
</style></head><body>
<header><h1>🐘 코끼리 그리기</h1><p>각자 낸 아이디어 한 조각을 모아, 눈먼 이들이 코끼리 전체를 그려 가듯 하나의 결론으로 정리합니다.</p><div id="rs" style="margin-top:8px"></div><div id="sv"></div><div id="pt" style="margin-top:8px"></div></header>
<main id="app"></main>

<div id="tl"><div class="in" id="tlin"></div><div id="tlsm"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={topic:"",ideas:[],groups:[],links:[],pos:{},wild:[],trunk:[],p1ok:false,qs:[],concl:"",gaps:[],stale:true,page:1,step:1,sel:null,note:"",team:[],c1:"",c1Stale:false,fq:{list:[]},lq:{},who:"",fills:[]};
let AIREADY=null,BUSY=false;
try{const r=localStorage.getItem("ideaflow");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("ideaflow",JSON.stringify(S))}catch(e){}}
async function getAI(){if(AIREADY!==null)return AIREADY;try{AIREADY=(window.claude&&await claude.use("sample"))||false}catch(e){AIREADY=false}return AIREADY}
async function ask(prompt){const a=await getAI();if(!a)return null;try{return await a.json(prompt)}catch(e){return null}}
function touch(){S.stale=true;save();}

/* [수정 3] 키워드 + 요약이 함께 들어가도록 요약 추출 로직 강화 */
function getShortSum(txt, fallback=""){
  const raw=(txt||fallback||"").trim();
  if(!raw)return "";
  return raw.length>24 ? raw.slice(0,23)+"…" : raw;
}
function nodes(){
  const n=[];
  if(S.topic)n.push({id:"T",kw:S.topic,sum:S.cp?getShortSum(S.cp):"",type:"topic"});
  S.ideas.forEach(i=>{
    const grp=S.groups[gidx(i.id)]||{};
    const sum=getShortSum(i.detail, grp.summary && grp.summary!==i.kw ? grp.summary : "");
    n.push({id:i.id,kw:i.kw,sum:sum,type:uniq(i.id)?"uni":"idea",g:gidx(i.id)});
  });
  S.wild.forEach(w=>{
    n.push({id:w.id,kw:w.kw,sum:getShortSum(w.sum,"엉뚱한 발상 촉매"),type:"wild"});
  });
  return n;
}
const gidx=id=>S.groups.findIndex(g=>g.ids.includes(id));
const uniq=id=>{const g=S.groups[gidx(id)];return !g||g.ids.length<2};
const GC=["--g1","--g2","--g3","--ac"];
function sim(a,b){const bg=s=>{s=s.replace(/\s/g,"");const r=new Set();for(let i=0;i<s.length-1;i++)r.add(s.slice(i,i+2));return r};const A=bg(a),B=bg(b);if(!A.size||!B.size)return a===b?1:0;let c=0;A.forEach(x=>B.has(x)&&c++);return c/Math.min(A.size,B.size)}
function localGroup(){const ids=S.ideas.map(i=>i.id),seen=new Set(),out=[];ids.forEach(id=>{if(seen.has(id))return;const A=S.ideas.find(i=>i.id===id);const m=[id];seen.add(id);ids.forEach(o=>{if(seen.has(o))return;const B=S.ideas.find(i=>i.id===o);if(sim(A.kw+A.detail.slice(0,10),B.kw)>=.5||sim(A.kw,B.kw)>=.5){m.push(o);seen.add(o)}});out.push({label:m.length>1?A.kw+" 계열":A.kw,ids:m,summary:A.detail?A.detail.slice(0,30):A.kw+" 관련 아이디어"})});return out}
function degree(){const d={};S.links.forEach(([a,b])=>{d[a]=(d[a]||0)+1;d[b]=(d[b]||0)+1});return d}
function topNodes(){const d=degree();return Object.keys(d).filter(k=>k!=="T").sort((a,b)=>d[b]-d[a]).slice(0,3)}
const kwOf=id=>(nodes().find(n=>n.id===id)||{}).kw||"";

/* [수정 4] 캔버스 확대(1100x680)에 맞춘 초기 배치 */
function layout(){
  const ns=nodes(),CX=550,CY=340;
  ns.forEach((n,i)=>{
    if(S.pos[n.id])return;
    if(n.id==="T")S.pos.T={x:CX,y:CY};
    else{
      const k=ns.length-1,a=(i-1)/Math.max(k,1)*Math.PI*2-1.2;
      S.pos[n.id]={x:CX+Math.cos(a)*380,y:CY+Math.sin(a)*230};
    }
  });
}
const POOL=["자판기","해파리","한밤의 도서관","거꾸로 가는 시계","화산","빵집","우주정거장","고양이 택시","비 오는 날","곰팡이","오케스트라","자전거 펌프","회전목마","펭귄","소금","지하철 2호선","모래시계","등대","마술사","김밥","낙엽","열기구","우산","도깨비","거미줄","불꽃놀이","체스판","편의점 야간 알바","선인장","아이스크림 트럭","번개","해녀","지구본","라디오","종이비행기","아쿠아리움","연필깎이","사막여우","시장 골목","눈사람","심해","피아노 조율사","도서 대출증","냉장고 자석","무지개","소방차","두더지","호떡","나침반","박물관의 밤","엘리베이터","비눗방울","양봉","택배 상자","거울의 방","보름달","벼룩시장","스케이트보드","고래","수제비","손난로","미로 찾기","우체통","해바라기","로봇 청소기","별자리","장난감 기차","곶감","불시착","보물 지도","오로라","감자튀김","탈춤","열쇠 수리공","수영장","풍선껌","노을","파수꾼","와플 기계","낙하산","사물함","고드름","만화 가게","헬멧","사탕 가게","얼음 조각","마라톤","두부","롤러코스터","시계탑","알람 소리","돋보기","허수아비","캠핑 의자","반딧불이","스노클링","인형 뽑기","뜨개질","맷돌"];

/* ---------- render ---------- */
function render(){S.rv=S.rv||{};const A=$("#app");
if(S.page===0)A.innerHTML=p0();else if(S.page===1)A.innerHTML=p1();else if(S.page===2)A.innerHTML=p2();else if(S.page===3)A.innerHTML=p3();else A.innerHTML=p4();
bind();tl();rs();sv();pt();zooSync()}
function stepsBar(n,arr){return '<div class="steps">'+arr.map((t,i)=>`<span class="${i+1===n?"on":""}">${i+1}. ${t}</span>`).join("")+'</div>'}
function p1(){const st=S.step,h=`<div class="card"><b>PAGE 1 · 키워드 마인드맵</b>`+stepsBar(st,["의견 투입","AI 카드 요약","마인드맵 연결","엉뚱한 키워드 · 연결 질문","투표 · 결론 · 동의"])+"</div>";
if(st===1)return h+`<div class="card"><label>중심 주제</label><textarea id="topic" rows="2" style="min-height:60px;overflow:hidden" placeholder="예: 우리 동네 도서관 활성화">${esc(S.topic)}</textarea><div class="row" style="margin-top:10px"><input id="au" placeholder="작성자" style="max-width:110px;min-width:90px;flex:none" value="${esc(S.who||"")}"><input id="kw" placeholder="키워드 (굵게 표시됨)"><input id="dt" placeholder="한 줄 요약 또는 상세 설명 (마인드맵에 작고 흐리게 함께 표시됨)"><button class="pri" id="add">추가</button></div><p class="msg">키워드와 함께 요약(설명)을 적어두면 마인드맵 노드에 <b>키워드</b>와 <span style="opacity:.7">작은 요약</span>이 나란히 표시됩니다.</p>${S.ideas.map(i=>`<span class="chip"><b>${esc(i.kw)}</b>${i.detail?` <small style="color:var(--mu)">(${esc(getShortSum(i.detail))})</small>`:""} <span data-ed="${i.id}" style="cursor:pointer">✎</span> <a href="#" data-del="${i.id}" style="text-decoration:none">✕</a></span>`).join("")}${kwEd()}</div><div class="nav"><button id="b0">← PAGE 0 · 공통 문제</button><button class="pri" id="to2" ${S.ideas.length<3||!S.topic?"disabled":""}>AI 카드 만들기 (키워드 3개 이상)</button></div>`;
if(st===2)return h+`<div class="card"><span class="chip" style="border-color:var(--un)">🟡 노란색 = 한 명만 낸 고유 아이디어</span><span class="chip">같은 색 막대 = AI가 묶은 비슷한 아이디어</span><p class="msg">${S.note||""}카드를 누르면 상세 설명이 열립니다. ✎로 수정·삭제, 카드를 오른쪽 클릭(또는 💬)하면 팀원 아이디어에 보완·수정·카드 추가 토의를 할 수 있어요.</p></div>${kwEd()}${thEd()}${S.groups.map((g,gi)=>!S.rv[g.ids.join(',')]?`<div class="card" style="text-align:center">🎴 <b>AI 카드 묶음 ${gi+1}</b> <span class="msg">(${g.ids.length}장)</span> <button data-rv="${g.ids.join(',')}" ${bal()<1?'disabled':''}>카드 열기 (1점)</button></div>`:`<div class="card"><b style="color:var(${GC[gi%4]})">${esc(g.label)}</b> <small class="msg">${esc(g.summary||"")}</small><div class="grid" style="margin-top:8px">${g.ids.map(id=>{const i=S.ideas.find(x=>x.id===id);return i?`<div class="card kc ${g.ids.length<2?"uni":""}" style="--c:var(${g.ids.length<2?"--un":GC[gi%4]})" data-flip="${id}"><h4>${esc(i.kw)} <span data-ed="${id}" style="cursor:pointer;font-size:12px">✎</span> <span data-th="${id}" style="cursor:pointer;font-size:12px">💬</span></h4><small class="d" id="d${id}">${esc((i.detail||"").slice(0,26)||"(설명 없음)")}…</small><div class="msg" style="margin:4px 0 0;font-size:12px">${i.who?esc(i.who):"작성자 없음"}${(i.th||[]).length?" · 💬 "+(i.th||[]).length:""}</div></div>`:""}).join("")}</div></div>`).join("")}<div class="nav"><button id="b1">← 수정</button><button class="pri" id="to3">마인드맵으로 연결 →</button></div>`;
if(st===3){layout();return h+`<div class="card"><p class="msg" style="margin-top:0">노드를 드래그해 배치하고, 두 노드를 차례로 클릭하면 선으로 연결(다시 연결하면 해제)됩니다. 아이디어 노드를 오른쪽 클릭하면 토의·카드 추가 메뉴가 열려요. 선택: <b>${esc(S.sel?kwOf(S.sel):"없음")}</b></p>${svg()}${linkEd()}${kwEd()}${thEd()}</div><div class="nav"><button id="b2">← 카드</button><button class="pri" id="to4" ${S.links.length<2?"disabled":""}>다음 (연결 2개 이상) →</button></div>`}
if(st===5)return h+p1s5();const tn=topNodes();return h+`<div class="card"><button id="wild" ${bal()<1||!S.ideas.length?"disabled":""}>🐘 엉뚱한 키워드 받기 (1점)</button> <span class="msg">AI가 뜬금없는 키워드를 기존 카드에 <b>미리 연결</b>하고, <b>엉뚱한 연결 질문(Q.)</b>도 함께 만들어 줍니다. 코끼리를 눌러도 받을 수 있어요!</span>${S.wild.length||S.links.length?svg()+linkEd()+kwEd()+thEd():""}</div>${lqUI()}<div class="nav"><button id="b3">← 마인드맵</button><button class="pri" id="to5">다음: 투표 · 결론 · 동의 →</button></div>`}

function lqAns(l){const o=S.lq[[l[0],l[1]].sort().join('|')];return o&&o.ans&&o.ans.length?o:null}

function lqLinks(){return S.links.filter(l=>l[0]!=="T"&&l[1]!=="T")}

      <div style="font-weight:700;margin:4px 0;font-size:15px">${esc(o.q)}</div>
      ${o.ans.map((a,j)=>`<p class="msg" style="margin:6px 0 0;color:var(--tx)">💬 <b>${esc(a.who)}</b>: ${esc(a.t)} <span data-lx="${k}" data-j="${j}" style="cursor:pointer;color:var(--mu)">✕</span></p>`).join("")}

function wrapT(t,n){const out=[];let cur='';String(t).trim().split(/\s+/).forEach(w=>{if((cur+' '+w).trim().length<=n)cur=(cur+' '+w).trim();else{if(cur)out.push(cur);let x=w;while(x.length>n){out.push(x.slice(0,n));x=x.slice(n)}cur=x}});if(cur)out.push(cur);return out.length?out.slice(0,12):['']}

/* [수정 3 & 4] 마인드맵 SVG: viewBox 1100x680 확대, 키워드 굵게 + 요약 작고 흐리게 표시 */
function svg(){
  const ns=nodes(),W=1100,H=680;
  let s=`<svg viewBox="0 0 ${W} ${H}" id="map">`;
  s+=`<g class="lk">${linkSvg()}</g>`;
  ns.forEach(n=>{
    const p=S.pos[n.id];if(!p)return;
    const sm=n.sum||"";
    const pre=n.type==="wild"?"🐘 ":n.type==="topic"?"⭐ ":"";
    const L=wrapT(n.kw,n.type==="topic"?20:18);
    L[0]=pre+L[0];
    const mx=Math.max(...L.map(x=>x.length));
    const bh=24+L.length*18+(sm?18:0);
    const y0=-bh/2;
    const w=Math.max(100,mx*15+44,sm.length*10+32);
    const col=n.type==="topic"?"var(--tx)":n.type==="wild"?"var(--wd)":n.type==="uni"?"var(--un)":`var(${GC[(n.g<0?0:n.g)%4]})`;
    const tx=L.map((x,k)=>`<tspan x="0" dy="${k?18:0}">${esc(x)}</tspan>`).join("");
    const kwFill=n.type==="topic"?"var(--bg)":"var(--tx)";
    const sumFill=n.type==="topic"?"var(--bg)":"var(--mu)";
    s+=`<g data-n="${n.id}" transform="translate(${p.x},${p.y})" style="cursor:grab">
      <rect x="${-w/2}" y="${y0}" width="${w}" height="${bh}" rx="${L.length>1||sm?24:20}" fill="${n.type==="topic"?"var(--tx)":"var(--sf)"}" stroke="${col}" stroke-width="${S.sel===n.id?5:3}" ${n.type==="wild"?'stroke-dasharray="6 3"':""}/>
      <text text-anchor="middle" y="${y0+24}" style="font-weight:700;font-size:14.5px;fill:${kwFill}">${tx}</text>
      ${sm?`<text text-anchor="middle" y="${y0+24+18*(L.length-1)+19}" style="font-size:11px;font-weight:400;fill:${sumFill};opacity:.72">${esc(sm)}</text>`:""}
    </g>`;
  });
  return s+"</svg>";
}

이 문제를 풀기 위한 브레인스토밍 마인드맵의 중심 주제 3개를 한국어로 제안하라.

function mapEvents(m){

  m.querySelectorAll("[data-l]").forEach(g=>g.onclick=e=>{e.stopPropagation();S.selL=+g.dataset.l;S.sel=null;render()});
  const pt=e=>{const r=m.getBoundingClientRect();return{x:(e.clientX-r.left)*1100/r.width,y:(e.clientY-r.top)*680/r.height}};
  m.onpointerdown=e=>{if(e.button!==0)return;const n=e.target.closest("[data-n]");if(!n)return;drag=n.dataset.n;moved=false;m.setPointerCapture(e.pointerId)};
  m.onpointermove=e=>{if(!drag)return;const p=pt(e);S.pos[drag]={x:Math.max(80,Math.min(1020,p.x)),y:Math.max(40,Math.min(640,p.y))};moved=true;const g=m.querySelector(`[data-n="${drag}"]`);g.setAttribute("transform",`translate(${S.pos[drag].x},${S.pos[drag].y})`);m.querySelector(".lk").innerHTML=linkSvg()};
  m.onpointerup=()=>{if(!drag)return;const id=drag;drag=null;if(moved){touch();render();return}
  if(!S.sel){S.sel=id;S.edId=id}else if(S.sel===id){S.sel=null;S.edId=null}else{S.edId=null;const w1=isW(S.sel),w2=isW(id);if(w1||w2){const o=w1?id:S.sel;if((w1&&w2)||o==="T"){S.warn=w1&&w2?"엉뚱한 키워드끼리는 연결할 수 없어요. 기존 키워드에 붙여 주세요.":"엉뚱한 키워드는 중심 주제가 아니라 기존 키워드에 연결해 주세요.";S.sel=null;render();return}}const k=S.links.findIndex(([a,b])=>(a===S.sel&&b===id)||(a===id&&b===S.sel));k>=0?S.links.splice(k,1):S.links.push([S.sel,id,""]);S.sel=null;S.selL=null;touch()}render()}
}

else{S.groups=localGroup();}S.note=ok?"":"(간이 분류 모드로 묶었어요) ";touch()}

/* [수정 5] 엉뚱한 키워드 생성 시 기존 카드와 즉시 연결 + 연결 질문(Q.) 사전 생성 */
async function wild(){
  if(!S.ideas.length)return[];
  if(!spend(1))return[];
  const b=$("#wild");if(b){b.disabled=true;b.textContent="받는 중…"}
  const norm=x=>String(x).replace(/\s/g,""),used=new Set(S.wild.concat(S.ideas).map(x=>norm(x.kw))),prev=S.wild.map(x=>x.kw).join(", "),TH=["자연·동물","음식","일상 물건","직업","장소","날씨·감정","놀이·스포츠","과학·우주","예술·음악","탈것·도구","역사·신화","몸·건강"],th=TH.slice().sort(()=>Math.random()-.5).slice(0,3),tg=S.ideas.slice().sort(()=>Math.random()-.5).slice(0,3);
  const r=await ask(`주제 “${S.topic}”에 대한 아이디어 카드 ${tg.length}개가 있다. 카드마다 엉뚱하고 뜬금없지만 연상 가능한 키워드 1개를 붙이고(분야: ${th.join(", ")}에서 하나씩), 그 키워드와 카드를 엮는 유쾌한 발상 질문을 "Q. "으로 시작하는 한 문장으로 만들어라. 이미 나온 것(${prev||"없음"})과 겹치면 안 된다.
예시) 카드 “도서관에 미술품을 전시하자” + 키워드 “딸기” → 질문 “Q. 딸기처럼 새콤달콤하고 톡 쏘는 미술품 전시는 어떨까?”.
sum은 그 엉뚱한 키워드의 특징을 12자 이내로 요약한 말.
JSON만: {"items":[{"idea":"카드 id","word":"...","sum":"...","q":"Q. ..."}]}\n${JSON.stringify(tg.map(i=>({id:i.id,card:i.kw,detail:i.detail||""})))}`);

  const got={};
  (r&&Array.isArray(r.items)?r.items:[]).forEach(x=>{
    if(x&&x.word&&x.idea&&tg.some(i=>i.id===x.idea)&&!got[x.idea]){
      const k=String(x.word).trim();
      if(k&&!used.has(norm(k))){
        got[x.idea]={kw:k,sum:String(x.sum||"").trim(),q:String(x.q||"").trim()};
        used.add(norm(k));
      }
    }
  });

  const pool=POOL.slice().sort(()=>Math.random()-.5),out=[];
  tg.forEach((i,n)=>{
    let g=got[i.id];
    if(!g){
      const pk=pool.find(q=>!used.has(norm(q)))||("엉뚱이"+(S.wild.length+n+1));
      used.add(norm(pk));
      g={
        kw:pk,
        sum:"엉뚱한 발상 촉매",
        q:`Q. '${pk}'처럼 색다르고 엉뚱한 매력을 '${i.kw}'에 더한다면 어떤 모습일까요?`
      };
    }
    const id="w"+Date.now()+n;
    S.wild.push({id,kw:g.kw,sum:g.sum||"엉뚱한 발상 촉매"});
    // 기존 카드 근처에 예쁘게 배치
    const basePos=S.pos[i.id]||{x:550,y:340};
    const ang=Math.random()*Math.PI*2;
    S.pos[id]={
      x:Math.max(100,Math.min(1000,basePos.x+Math.cos(ang)*150)),
      y:Math.max(60,Math.min(620,basePos.y+Math.sin(ang)*120))
    };
    // 사용자 연결 전에도 연결과 질문을 미리 생성해 등록
    S.links.push([i.id,id,"",0,[]]);
    const qText=g.q.startsWith("Q.")?g.q:"Q. "+g.q;
    S.lq[lqKey([i.id,id])]={q:qText,ans:[]};
    out.push({kw:g.kw,card:i.kw});
  });
  layout();touch();render();return out;
}
